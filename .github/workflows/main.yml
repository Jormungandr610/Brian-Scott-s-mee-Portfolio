
name: Deploy React Site

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-react-app/package-lock.json

      - name: Install dependencies
        working-directory: my-react-app
        run: npm ci

      - name: Build React project
        working-directory: my-react-app
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-react-app/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
